<!DOCTYPE html>
<html lang="en">
<head>
	<title>Online Book Shop</title>
	<style type="text/css">
			.p1{
				background-image: url("home.jpg") ;
				background-repeat: no-repeat;
				background-position: center;}
			#context{width: 700px;
				margin-left: 250px;
				margin-right: auto;
				color: black;}
			form{font-size: 25px;color:white; }
			p{margin-left: 20px;font-size: 25px;color: black;}
			h3{color: white;margin-left: 20px;}
			h1{text-shadow: 10px 10px 5px darkgray;
					color: black;
					text-align: center;}
			.buybbb{font-size: 20px;
				width: 90px;
				height: 25px;
				border: none;
				border-radius: 24px;
				background-color: #f07857;
				color: white;}	
			.emm{width: 200px;
					height: 18px;
					border-radius: 24px;
					border: none;
					background-color: darkgray;}
			.logo{margin-top: 350px; margin-left: 50px;}
			.logo1{border-radius: 24px;}		
	</style>
</head>
<body class="p1">
	<div id="context">
	<img src="IMG_20230219_124429.jpg" width="50px" height="40px">
	<h1>Welcome To  online book shop</h1>
	<p>Please, sign in to buy books</p>
	
	
	<h2>Sign in</h2>	
	<form name="f1" action="p2.html" method="get">
		<table border="0" align="left" cellspacing="50"  >
		<tr>
			<td>Enter your Email:</td>
			<td><input type="Email" placeholder="Enter email" required="required" class="emm"></td>
		</tr>
		<tr>
			<td>Enter your Password:</td>
			<td><input type="Password" placeholder="******" maxlength="6" required="required" class="emm"></td>
		</tr>
		<tr>
			<td>Gender:</td>
			<td><input type="radio" name="r1" id="r2" >Male
			<input type="radio" name="r1" id="r2" >Female
			<input type="radio" name="r1" id="r2" >Other</td>
		</tr>
		<tr>
			
			<td><input type="reset" class="buybbb" value="Cancel"></td>
			<td><input type="submit" value="Sign in" class="buybbb" ></td>
		</tr>

		
		</table>
		</form>
		<table border="0" cellspacing="5px"  class="logo">
			<tr>
				<td><img src="IMG_20230219_111302.jpg" width="40px" height="40px" class="logo1"></td>
				<td><img src="IMG_20230219_111836.jpg" width="40px" height="40px" class="logo1"></td>
				<td><img src="IMG_20230219_111921.jpg" width="40px" height="40px" class="logo1"></td>
				<td><img src="IMG_20230219_111950.jpg" width="40px" height="40px" class="logo1"></td>
			</tr>
		</table>
		</div></div>
</body>
</html>
